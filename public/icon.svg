<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <!-- Background Circle (Brand Yellow) -->
  <circle cx="50" cy="50" r="48" fill="#FFD54A" stroke="#6B3F1F" stroke-width="4"/>
  
  <!-- Happy Eyes (curved arcs for cheerful smile) -->
  <path d="M 28 42 Q 36 30 44 42" fill="none" stroke="#6B3F1F" stroke-width="6" stroke-linecap="round"/>
  <path d="M 56 42 Q 64 30 72 42" fill="none" stroke="#6B3F1F" stroke-width="6" stroke-linecap="round"/>
  
  <!-- Cute Blushing Cheeks (Brand Red) -->
  <circle cx="24" cy="52" r="6" fill="#FF5A5F"/>
  <circle cx="76" cy="52" r="6" fill="#FF5A5F"/>
  
  <!-- Big Happy Mouth with Yum Tongue (😋 expression) -->
